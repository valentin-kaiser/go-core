# Services for the Redis and RabbitMQ tests and benchmarks.
#
#   docker compose -f test/docker-compose.yaml up -d
#   go test ./cache ./queue
#
# The credentials match the ones hard coded in queue/rabbitmq_test.go.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "127.0.0.1:5672:5672"
