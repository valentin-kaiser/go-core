# Services for the Redis, RabbitMQ, MySQL and PostgreSQL tests and benchmarks.
#
#   docker compose -f test/compose.yaml up -d
#   go test ./cache ./queue ./database
#
# The credentials and ports match the defaults of the tests: queue/rabbitmq_test.go,
# cache/redis_test.go (REDIS_URL) and database/server_test.go (MYSQL_DSN, POSTGRES_DSN).
# MySQL and PostgreSQL use uncommon host ports so they do not clash with a local server.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "127.0.0.1:5672:5672"
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_DATABASE: bench
    ports:
      - "127.0.0.1:13306:3306"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:15432:5432"
