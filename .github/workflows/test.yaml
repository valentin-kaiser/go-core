---
name: Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: |
          # Exclude machine package on Linux as it requires hardware access not available in CI
          packages=$(go list ./... | grep -v '/machine$')
          go test -v $packages 2>&1 | tee test.log

      - name: Report test failures
        if: failure()
        run: bash .github/scripts/test-report.sh test.log Linux

      - name: Run race detector
        run: |
          # The machine package is excluded for the same reason as in the test step
          packages=$(go list ./... | grep -v '/machine$')
          go test -race $packages

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: |
          # Exclude machine package on Windows as it requires hardware access not available in CI
          packages=$(go list ./... | grep -v '/machine$')
          go test -v $packages 2>&1 | tee test.log

      - name: Report test failures
        if: failure()
        shell: bash
        run: bash .github/scripts/test-report.sh test.log Windows

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: |
          # Exclude machine package on macOS as it requires hardware access not available in CI
          packages=$(go list ./... | grep -v '/machine$')
          go test -v $packages 2>&1 | tee test.log

      - name: Report test failures
        if: failure()
        run: bash .github/scripts/test-report.sh test.log macOS

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start services
        run: docker compose -f test/compose.yaml up -d --wait

      - name: Run integration tests
        run: go test -race -tags integration ./cache ./queue ./database

      - name: Stop services
        if: always()
        run: docker compose -f test/compose.yaml down
